name: India Trend Radar Scheduler

on:
  schedule:
    # Runs every Sunday at 6:00 AM IST (00:30 UTC)
    - cron: '30 0 * * 0'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  data-collection:
    runs-on: ubuntu-latest

    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Install spaCy Model
      - name: Install spaCy Model
        run: |
          python -m spacy download en_core_web_sm

      # -----------------------------
      # GOOGLE TRENDS
      # -----------------------------
      - name: Run Google Trends
        run: python -m scripts.data_collection.google_trends

      - name: Run Google Cleaning
        run: python -m scripts.Cleaning.google_cleaning

      # -----------------------------
      # NEWS
      # -----------------------------
      - name: Run News Collection
        run: python -m scripts.data_collection.news_fetch

      - name: Run News Cleaning
        run: python -m scripts.Cleaning.news_cleaning

      # -----------------------------
      # YOUTUBE
      # -----------------------------
      - name: Run YouTube Collection
        run: python -m scripts.data_collection.youtube_fetch

      - name: Run YouTube Cleaning
        run: python -m scripts.Cleaning.youtube_cleaning

      # -----------------------------
      # NLP PIPELINE
      # -----------------------------
      - name: Run spaCy NER
        run: python -m scripts.Phase_2.spacy_ner

      - name: Run KeyBERT
        run: python -m scripts.Phase_2.keybert_extract

      - name: Run YAKE
        run: python -m scripts.Phase_2.yake_extract

      - name: Run BERTopic
        run: python -m scripts.Phase_2.bertopic_model

      - name: Run Unified Topic IDs
        run: python -m scripts.Phase_2.unified_topic_ids

      # -----------------------------
      # FEATURE ENGINEERING
      # -----------------------------
      - name: Run Feature Engineering
        run: python -m scripts.features.pipeline

      # -----------------------------
      # PHASE 3: MODEL RETRAINING
      # -----------------------------
      - name: Run Model Retraining
        run: python -m scripts.Phase_3.retraining

      # -----------------------------
      # COMMIT CHANGES
      # -----------------------------
      - name: Commit and Push Updated Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Automated weekly pipeline & model retraining update"
          
          git pull --rebase origin main

          git push origin main